<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle de Fiado</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #ede9fe;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  background: #ffffff;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 { text-align: center; }

.form {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.form input {
  flex: 1;
  padding: 10px;
}

.form button {
  padding: 10px 15px;
  border: none;
  background: #7c3aed;
  color: #fff;
  border-radius: 5px;
  cursor: pointer;
}

ul { list-style: none; padding: 0; }

li {
  background: #f5f3ff;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.excluir {
  background: #ef4444;
  border: none;
  color: #fff;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <h2>🧾 Controle de Fiado</h2>

  <div class="form">
    <input id="nome" placeholder="Nome do cliente">
    <input id="produto" placeholder="Produto">
    <button id="btnSalvar">Adicionar</button>
  </div>

  <ul id="lista"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCK-ErMcHNHT_BpfBQTPS-xuo3c2gUXpjQ",
  authDomain: "controle-fiado-dfb6c.firebaseapp.com",
  projectId: "controle-fiado-dfb6c",
  storageBucket: "controle-fiado-dfb6c.firebasestorage.app",
  messagingSenderId: "730584046873",
  appId: "1:730584046873:web:2d40814ee81eb03d52f988"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const nomeInput = document.getElementById("nome");
const produtoInput = document.getElementById("produto");
const lista = document.getElementById("lista");
const btnSalvar = document.getElementById("btnSalvar");

btnSalvar.onclick = async () => {
  const nome = nomeInput.value.trim();
  const produto = produtoInput.value.trim();

  if (!nome || !produto) {
    alert("Preencha todos os campos!");
    return;
  }

  await addDoc(collection(db, "fiados"), { nome, produto });

  nomeInput.value = "";
  produtoInput.value = "";
};

function carregar() {
  onSnapshot(collection(db, "fiados"), (snapshot) => {
    lista.innerHTML = "";
    snapshot.forEach((docu) => {
      const d = docu.data();

      const li = document.createElement("li");
      li.innerHTML = `
        <div>
          <b>${d.nome}</b><br>${d.produto}
        </div>
        <button class="excluir">Excluir</button>
      `;

      li.querySelector("button").onclick = async () => {
        await deleteDoc(doc(db, "fiados", docu.id));
      };

      lista.appendChild(li);
    });
  });
}

carregar();
</script>

</body>
</html>
